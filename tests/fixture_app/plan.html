<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plateful — Plan your week</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <nav>
    <a class="nav-link" href="/" data-testid="nav-home">Home</a>
  </nav>
</header>
<main>
  <h1>Plan your week</h1>
  <!-- Two-step wizard on ONE url. Step 2 swaps the fields in place via JS
       without changing route, dialog, overlay, or any other flag — only the
       page STRUCTURE (testids, form-control types) changes. Pins that the
       walker treats same-route structural states as distinct screens.
       Step 1 REJECTS empty submits (required dish + email): the walker must
       fill text-like inputs before clicking Next or step 2 is unreachable. -->
  <form id="wizard">
    <div id="wizard-step"></div>
  </form>
</main>
<script src="/consent.js"></script>
<script>
(function () {
  var step = document.getElementById('wizard-step');
  function renderStep2() {
    step.innerHTML =
      '<label>Which night? <select name="night" data-testid="wizard-night">' +
      '<option>Monday</option><option>Wednesday</option><option>Friday</option>' +
      '</select></label> ' +
      '<label>Servings <input type="number" name="servings" ' +
      'data-testid="wizard-servings"></label> ' +
      '<button type="button" data-testid="wizard-finish">Finish</button>';
    step.querySelector('[data-testid="wizard-finish"]')
      .addEventListener('click', function () { location.href = '/'; });
  }
  function renderStep1() {
    step.innerHTML =
      '<label>What are you cooking first? ' +
      '<input type="text" name="dish" data-testid="wizard-dish" required></label> ' +
      '<label>Email for the shopping list ' +
      '<input type="email" name="email" data-testid="wizard-email" required></label> ' +
      '<button type="button" data-testid="wizard-next">Next</button>';
    step.querySelector('[data-testid="wizard-next"]')
      .addEventListener('click', function () {
        var dish = step.querySelector('[data-testid="wizard-dish"]');
        var email = step.querySelector('[data-testid="wizard-email"]');
        if (!dish.value || email.value.indexOf('@') === -1) {
          if (!step.querySelector('.wizard-error')) {
            var err = document.createElement('p');
            err.className = 'wizard-error';
            err.textContent = 'Both fields are needed before we can plan.';
            step.appendChild(err);
          }
          return;
        }
        renderStep2();
      });
  }
  renderStep1();
})();
</script>
</body>
</html>
