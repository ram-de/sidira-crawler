name: crawl

# Product-dispatched crawl: the single entry point the simulator backend
# fires via the GitHub API (sidira-simulator #193). Two modes share this
# workflow (selected by the "Select crawl mode" step):
#   mock (streamly-sandbox / no config_json) — boot the sandbox image, judge
#     against its ground-truth manifest (walk job), then synthesize + publish
#     (synthesize job). The chain is walk → upload raw.jsonl to R2 → synthesize
#     → flip `latest`.
#   production (#23, real tenant with a saved config_json) — run the whole
#     honesty-gated chain inside the walk job: walk the live sandbox → gate →
#     synthesize → flip `latest`. The synthesize job is skipped.
# Either way the `latest` pointer flip IS the publish: the simulator picks up
# the new snapshot with no further step.
#
# Correlation: workflow_dispatch returns no run id, so the dispatcher
# generates a `crawl_id` and finds its run by `display_title` — that is why
# `run-name` below MUST start with "crawl <crawl_id>". Do not reword it
# without updating the backend's run lookup.
#
# Progress: the backend derives phase from this run's jobs (walk
# in_progress → walking, synthesize in_progress → synthesizing). Job names
# are part of that contract too.
#
# Queueing: GitHub holds at most ONE pending run per concurrency group — a
# third dispatch for the same customer CANCELS the previously pending run
# (the running one is never cancelled). The dispatcher must treat a run
# that concluded `cancelled` without starting any jobs as "superseded by a
# newer dispatch", not as a failed crawl.
#
# sandbox-walk.yml (PR gate, R2 optional) and synthesize-pack.yml (manual
# synthesis of an existing walk) stay as-is; this workflow deliberately
# mirrors their steps rather than sharing via workflow_call so the gate
# keeps working even if product-crawl needs diverge.

on:
  workflow_dispatch:
    inputs:
      crawl_id:
        description: "Dispatcher-generated id used to find this run (appears in run-name)"
        required: true
      customer:
        description: "Customer ID — selects acceptance/<customer>.json and the R2 prefix"
        required: true
        default: "streamly-sandbox"
      crawl_date:
        description: "Crawl date (YYYY-MM-DD). Empty = today (UTC). Dispatchers should pass it explicitly — CI dates are UTC."
        required: false
        default: ""
      snapshot:
        description: "Snapshot version tag. Empty = ISO week of the walk's run_date."
        required: false
        default: ""
      config_json:
        description: "Non-secret saved crawl setup (JSON) from the simulator backend (sidira-simulator #206). Empty = streamly-sandbox mock acceptance path. For a real tenant it drives the production walk → honesty gate → synthesize → publish chain (#23)."
        required: false
        default: ""

run-name: "crawl ${{ inputs.crawl_id }} · ${{ inputs.customer }}"

# One crawl per customer at a time; a second dispatch queues instead of
# racing the first on the same R2 keys.
concurrency:
  group: crawl-${{ inputs.customer }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      crawl_date: ${{ steps.date.outputs.crawl_date }}
      mode: ${{ steps.mode.outputs.mode }}
    env:
      # The only sandbox today. When a second customer exists, map
      # customer → image here (or in a checked-in JSON) instead of branching
      # in the dispatcher.
      SANDBOX_IMAGE: ghcr.io/ram-de/streamly-sandbox@sha256:abdeb699118e99271363c0ea705a8142cbd1e55debb80211e7e0830892b9aaff
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Unlike sandbox-walk.yml, R2 is NOT optional here: a product crawl
      # that can't persist its walk is a failed crawl. Fail before spending
      # 16 minutes walking. Only the NAMES of missing secrets are printed.
      - name: Check required secrets
        run: |
          missing=()
          for name in R2_BUCKET R2_ENDPOINT_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY GROQ_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing secrets::Cannot crawl without: ${missing[*]}"
            exit 1
          fi

      # The REST dispatch API does NOT enforce `required: true` on inputs,
      # and customer/crawl_date/snapshot become R2 key segments and a config
      # path — reject anything that would mis-correlate the run or escape
      # the customer's R2 namespace before spending walk time.
      - name: Validate inputs
        env:
          CRAWL_ID: ${{ inputs.crawl_id }}
          CUSTOMER: ${{ inputs.customer }}
          CRAWL_DATE: ${{ inputs.crawl_date }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          fail() { echo "::error title=Invalid input::$1"; exit 1; }
          [ -n "$CRAWL_ID" ] || fail "crawl_id is empty — the run could not be correlated to its dispatch"
          # Clerk org ids (the production tenant key, e.g. org_2NXx...) carry an
          # underscore and mixed case, so the charset is wider than a DNS-ish
          # slug — but still a single safe R2 key segment / filename, no
          # leading dash. Mirrored by _CUSTOMER_RE in the simulator backend.
          [[ "$CUSTOMER" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || fail "customer must be alphanumeric/hyphen/underscore (max 64, no leading dash), got: $CUSTOMER"
          [ -z "$CRAWL_DATE" ] || [[ "$CRAWL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || fail "crawl_date must be YYYY-MM-DD, got: $CRAWL_DATE"
          [ -z "$SNAPSHOT" ] || [[ "$SNAPSHOT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || fail "snapshot has characters unsafe for an R2 key segment: $SNAPSHOT"

      # Resolved once and shared with the synthesize job so the upload key
      # and the download key can never disagree across a midnight-UTC
      # boundary.
      - name: Resolve crawl date
        id: date
        env:
          CRAWL_DATE: ${{ inputs.crawl_date }}
        run: |
          date="${CRAWL_DATE:-$(date -u +%F)}"
          echo "crawl_date=$date" >> "$GITHUB_OUTPUT"
          echo "crawl date: $date"

      # Two crawl modes share this workflow (#23):
      #   production — a real tenant that shipped a saved crawl setup. Walks the
      #     customer's live sandbox_url through run_crawl (walk → honesty gate →
      #     synthesize → publish), all in THIS job: the gate's determinism
      #     re-walk needs the live sandbox + credentials, so it cannot be split
      #     into the downstream synthesize job. config_json is read from env,
      #     never interpolated into the shell, so its contents can't inject.
      #   mock — streamly-sandbox (or any tenant with no config_json). Boots the
      #     sandbox docker image and judges against its ground-truth manifest via
      #     scripts/sandbox_acceptance.py, then the synthesize job builds + publishes.
      - name: Select crawl mode
        id: mode
        env:
          CUSTOMER: ${{ inputs.customer }}
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          if [ -n "$CONFIG_JSON" ] && [ "$CUSTOMER" != "streamly-sandbox" ]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "crawl mode: production (saved setup, real tenant '$CUSTOMER')"
          else
            echo "mode=mock" >> "$GITHUB_OUTPUT"
            echo "crawl mode: mock sandbox acceptance ('$CUSTOMER')"
          fi

      # Pull per-customer login credentials from the simulator (PULL model,
      # sidira-simulator #206 Slice C). Passwords are entered in the crawl-setup
      # window, encrypted at rest, and delivered ONLY over this authenticated
      # endpoint — never committed to acceptance/*.json, never carried in the
      # workflow_dispatch payload. The walker overlays them via
      # SIDIRA_CRAWL_CREDENTIALS (see scripts/sandbox_acceptance.py).
      #
      # 404 is NOT an error: the streamly-sandbox demo and any tenant that has
      # not saved logins yet have nothing to deliver, so the run falls back to
      # the inline judge-config creds. Any other non-200 (401/403/5xx) is a hard
      # failure — we will not silently crawl with stale creds when the pull was
      # meant to succeed. Without the token configured at all, also fall back.
      - name: Pull crawl credentials
        env:
          CUSTOMER: ${{ inputs.customer }}
          CREDENTIALS_TOKEN: ${{ secrets.SIDIRA_CRAWLER_CREDENTIALS_TOKEN }}
          API_BASE: ${{ vars.SIDIRA_API_BASE || 'https://api.sidira.ai' }}
        run: |
          if [ -z "$CREDENTIALS_TOKEN" ]; then
            echo "::notice title=No credential token::SIDIRA_CRAWLER_CREDENTIALS_TOKEN unset — using inline judge-config creds"
            exit 0
          fi
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CREDENTIALS_TOKEN}" \
            "${API_BASE}/internal/crawl-credentials/${CUSTOMER}")"
          if [ "$code" = "404" ]; then
            echo "::notice title=No stored credentials::no credentials saved for ${CUSTOMER} (404) — using inline judge-config creds"
            rm -f "$body"; exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error title=Credential pull failed::GET /internal/crawl-credentials/${CUSTOMER} returned ${code}"
            rm -f "$body"; exit 1
          fi
          # Mask every pulled password BEFORE it can reach any later log line.
          # Read line by line so a password containing spaces is masked whole.
          jq -r '.logins[].password' "$body" | while IFS= read -r pw; do
            [ -n "$pw" ] && echo "::add-mask::${pw}"
          done
          # Hand the whole response to the walker as one env var. Passwords are
          # already registered as masks; usernames are not secret. Heredoc form
          # is multiline-safe even though the body is single-line JSON.
          {
            echo "SIDIRA_CRAWL_CREDENTIALS<<__SIDIRA_CREDS_EOF__"
            cat "$body"
            echo
            echo "__SIDIRA_CREDS_EOF__"
          } >> "$GITHUB_ENV"
          echo "pulled credentials for roles: $(jq -r '[.logins[].role] | join(", ")' "$body")"
          rm -f "$body"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + browser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      # Mock-only: only the sandbox-image boot pulls from GHCR. The production
      # path walks the customer's live sandbox_url and never touches docker.
      - name: Log in to GHCR
        if: steps.mode.outputs.mode == 'mock'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --jobs 3: see sandbox-walk.yml — walks are independent and output
      # order is plan-fixed, so raw.jsonl is identical to a sequential run.
      # The acceptance gate runs here too: a walk that fails its own
      # coverage gate must not become a published pack. The synthesize job
      # downstream turns this raw.jsonl into the published pack.
      - name: Walk sandbox (mock acceptance)
        if: steps.mode.outputs.mode == 'mock'
        env:
          CUSTOMER: ${{ inputs.customer }}
          CRAWL_DATE: ${{ steps.date.outputs.crawl_date }}
        run: |
          python scripts/sandbox_acceptance.py \
            --image "$SANDBOX_IMAGE" \
            --config "acceptance/${CUSTOMER}.json" \
            --run-date "$CRAWL_DATE" \
            --out raw.jsonl \
            --jobs 3

      # Production path (#23): a real tenant's saved setup arrives as config_json
      # and its logins as SIDIRA_CRAWL_CREDENTIALS (set by "Pull crawl
      # credentials" above). run-dispatch fuses both into a CustomerConfig and
      # runs the whole honesty-gated chain — walk the live sandbox → gate →
      # synthesize → flip `latest` — entirely in this job, because the gate's
      # determinism re-walk needs the live sandbox and credentials. The
      # honesty gate (#206 Slice D) is the safety net: a failing crawl publishes
      # nothing and exits non-zero. config_json is read from env (CONFIG_JSON),
      # never interpolated into the shell, so its contents can't inject.
      - name: Crawl, gate, synthesize and publish (production)
        if: steps.mode.outputs.mode == 'production'
        env:
          CUSTOMER: ${{ inputs.customer }}
          CRAWL_DATE: ${{ steps.date.outputs.crawl_date }}
          SNAPSHOT: ${{ inputs.snapshot }}
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          args=(--customer "$CUSTOMER" --crawl-date "$CRAWL_DATE" --config-json-env CONFIG_JSON)
          [ -n "$SNAPSHOT" ] && args+=(--snapshot "$SNAPSHOT")
          python -m sidira_crawler.cli run-dispatch "${args[@]}"

      # Mock-only: the production path writes its pack straight to R2 and never
      # produces a local raw.jsonl. `always()` so a failed-but-attempted mock
      # walk still uploads its partial raw for debugging.
      - name: Upload raw walk artifact
        if: always() && steps.mode.outputs.mode == 'mock'
        uses: actions/upload-artifact@v4
        with:
          name: raw-jsonl
          path: raw.jsonl
          if-no-files-found: warn

      - name: Upload raw.jsonl to R2
        if: steps.mode.outputs.mode == 'mock'
        env:
          CUSTOMER: ${{ inputs.customer }}
          CRAWL_DATE: ${{ steps.date.outputs.crawl_date }}
        run: |
          python - <<'EOF'
          import os
          import boto3

          key = f"customers/{os.environ['CUSTOMER']}/crawl/{os.environ['CRAWL_DATE']}/raw.jsonl"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
          )
          client.upload_file("raw.jsonl", os.environ["R2_BUCKET"], key)
          print(f"uploaded raw.jsonl -> s3://{os.environ['R2_BUCKET']}/{key}")
          EOF

  # Mock path only. The production path already synthesized + published inside
  # the walk job (run-dispatch), so this job is skipped for real tenants — the
  # backend simply never observes a "synthesizing" phase for a production crawl;
  # the run still concludes success on the walk job and the `latest` flip the
  # production path performed is the publish event the simulator picks up.
  synthesize:
    needs: walk
    if: needs.walk.outputs.mode == 'mock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download raw walk from R2
        env:
          CUSTOMER: ${{ inputs.customer }}
          CRAWL_DATE: ${{ needs.walk.outputs.crawl_date }}
        run: |
          python - <<'EOF'
          import os
          import boto3

          key = f"customers/{os.environ['CUSTOMER']}/crawl/{os.environ['CRAWL_DATE']}/raw.jsonl"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
          )
          client.download_file(os.environ["R2_BUCKET"], key, "raw.jsonl")
          print(f"downloaded s3://{os.environ['R2_BUCKET']}/{key}")
          EOF

      # R2_BUCKET being set makes get_store() pick the R2 store, so the pack
      # is written straight to R2, and `cli synthesize` flips the
      # featurepacks/latest pointer after pack + diff land — that pointer
      # flip is the publish event the simulator observes.
      - name: Synthesize Feature Pack and publish latest
        env:
          CUSTOMER: ${{ inputs.customer }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          args=(--raw raw.jsonl --customer "$CUSTOMER")
          [ -n "$SNAPSHOT" ] && args+=(--snapshot "$SNAPSHOT")
          python -m sidira_crawler.cli synthesize "${args[@]}"

      # Keep a copy as a workflow artifact for inspection without R2 access.
      # NOTE: this mirrors the snapshot PREFIX, which can contain stale
      # capability dirs from earlier writes at the same key — the manifest
      # is the source of truth for pack membership.
      #
      # continue-on-error from here down: the pointer flip above already
      # published the pack, so a hiccup in these inspection-only steps must
      # not conclude the run `failure` — the dispatcher would report a
      # failed crawl while the simulator is already serving the new pack.
      - name: Mirror snapshot for artifact
        continue-on-error: true
        env:
          CUSTOMER: ${{ inputs.customer }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          python - <<'EOF'
          import os

          import boto3

          from sidira_crawler.synthesis.graph import load_raw_jsonl
          from sidira_crawler.synthesis.pack import weekly_bucket

          # Re-synthesizing would double the LLM spend; mirror the
          # just-written snapshot from R2 instead.
          graph = load_raw_jsonl("raw.jsonl")
          snapshot = os.environ["SNAPSHOT"] or weekly_bucket(graph.run_date)
          prefix = f"customers/{os.environ['CUSTOMER']}/featurepacks/{snapshot}/"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
          )
          paginator = client.get_paginator("list_objects_v2")
          count = 0
          for page in paginator.paginate(Bucket=os.environ["R2_BUCKET"], Prefix=prefix):
              for obj in page.get("Contents", []):
                  rel = obj["Key"][len(prefix):]
                  dest = os.path.join("pack-artifact", rel)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  client.download_file(os.environ["R2_BUCKET"], obj["Key"], dest)
                  count += 1
          print(f"mirrored {count} objects from s3://{os.environ['R2_BUCKET']}/{prefix}")
          assert count > 0, "pack prefix is empty — R2 write did not land"
          EOF

      - name: Upload pack artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: feature-pack
          path: pack-artifact/
          if-no-files-found: error
